<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vstup do aplikace</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #121212; 
            color: #ffffff; 
            margin: 0; 
        }
        .box { 
            background: #1e1e1e; 
            padding: 45px 40px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 460px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h2 { 
            margin-top: 0; 
            margin-bottom: 12px; 
            color: #fff; 
            font-size: 28px; 
        }
        p.subtitle { 
            color: #aaa; 
            font-size: 16px; 
            margin-bottom: 28px; 
        }
        input { 
            width: 100%; 
            padding: 16px; 
            margin: 10px 0; 
            border-radius: 10px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: white; 
            font-size: 17px;
            outline: none;
        }
        input:focus { border-color: #007bff; }
        button { 
            width: 100%; 
            padding: 16px; 
            background: #007bff; 
            border: none; 
            color: white; 
            border-radius: 10px; 
            cursor: pointer; 
            margin-top: 18px; 
            font-weight: bold; 
            font-size: 18px;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        .error { 
            background: rgba(255, 85, 85, 0.1); 
            color: #ff5555; 
            padding: 14px; 
            border-radius: 8px; 
            margin-bottom: 16px; 
            font-size: 15px; 
            border: 1px solid rgba(255, 85, 85, 0.3);
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Vstup / Přihlášení</h2>
        <p class="subtitle">Zadej své jméno, e-mail a heslo pro vstup</p>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <input type="text" name="display_name" placeholder="Tvoje Jméno / Nick" required>
            <input type="email" name="email" placeholder="Tůj E-mail" required>
            <input type="password" name="password" placeholder="Heslo" required>
            <button type="submit">Vstoupit</button>
        </form>
    </div>
</body>
</html>
