<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vstup do aplikace</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #121212; 
            color: #ffffff; 
            margin: 0; 
        }
        .box { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 340px; 
            text-align: center; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { margin-top: 0; margin-bottom: 20px; color: #fff; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 6px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: white; 
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #007bff; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #007bff; 
            border: none; 
            color: white; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 14px; 
            font-weight: bold; 
            font-size: 15px;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        .error { 
            background: rgba(255, 85, 85, 0.1); 
            color: #ff5555; 
            padding: 10px; 
            border-radius: 6px; 
            margin-bottom: 12px; 
            font-size: 13px; 
            border: 1px solid rgba(255, 85, 85, 0.3);
        }
        p.subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Vstup / Přihlášení</h2>
        <p class="subtitle">Zadej své jméno a heslo pro vstup</p>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <input type="text" name="display_name" placeholder="Tvoje Jméno / Nick" required>
            <input type="password" name="password" placeholder="Heslo" required>
            <button type="submit">Vstoupit</button>
        </form>
    </div>
</body>
</html>
